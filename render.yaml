services:
  # API (FastAPI) — a mesma DATABASE_URL do Supabase entra pelo dashboard do
  # Render (não fica no yaml, "sync: false" só reserva a variável).
  - type: web
    name: ppg-rota-comercial-backend
    runtime: python
    # Starter (pago) e nao free: o plano gratuito hiberna apos ~15min sem uso,
    # e o vendedor esperando ~50s na frente do cliente nao e aceitavel. O yaml
    # dizia "free" enquanto o servico real ja era Starter — corrigido para as
    # duas coisas nao divergirem de novo.
    #
    # Atencao ao dimensionar importacao: Starter tem 512 MB de RAM, e a
    # importacao do banco mestre ja derrubou o processo uma vez por carregar
    # dezenas de milhares de linhas de uma vez (ver services/atualizacao.py).
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/saude
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: TOKEN_DIAS
        value: "60"
      - key: CORS_ORIGEM_EXTRA
        value: https://ppg-rota-comercial.onrender.com

  # Frontend (Vite/React), servido como site estático — serviço separado do
  # backend porque este app não é servido pelo FastAPI (diferente do gado_app).
  - type: web
    name: ppg-rota-comercial
    runtime: static
    rootDir: app
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ppg-rota-comercial-backend.onrender.com
